# Builds CaseKeeper and runs the three test programs on every push to main and every pull request.
# Note: Windows runners count double against a private repository's free Actions minutes.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'assets/**', 'docs/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build CaseKeeper/CaseKeeper.csproj -c Release --nologo

      - name: Document engine tests
        shell: pwsh
        run: |
          dotnet run --project tests/CaseKeeper.Tests.Docs -- "$env:RUNNER_TEMP/ck-test-output"
          if ($LASTEXITCODE -ne 0) { throw "Document engine tests failed" }

      - name: Data layer tests
        shell: pwsh
        run: |
          dotnet run --project tests/CaseKeeper.Tests.Data
          if ($LASTEXITCODE -ne 0) { throw "Data layer tests failed" }

      - name: Bulk Case Import tests
        shell: pwsh
        run: |
          dotnet run --project tests/CaseKeeper.Tests.BulkImport
          if ($LASTEXITCODE -ne 0) { throw "Bulk Case Import tests failed" }
