name: Bug report
description: Something in CaseKeeper isn't working as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Please don't include any personal or case information** – no names, dates of birth, case numbers,
        addresses, document contents or screenshots of real documents. Issues may become public.
        Security problems go through [private reporting](https://github.com/DarkCipher0x/CaseKeeper/security/advisories/new) instead.
  - type: input
    id: version
    attributes:
      label: CaseKeeper version
      description: Settings → About
      placeholder: "0.4.0"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installed from
      options:
        - Website / GitHub installer (.exe)
        - Microsoft Store
        - Built from source
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Documents
        2. Click Import folder
        3. ...
  - type: input
    id: reference
    attributes:
      label: Error reference
      description: The *Reference* code from the error message, if there was one. It identifies the log entry without revealing anything.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I haven't included any personal or case information.
          required: true
